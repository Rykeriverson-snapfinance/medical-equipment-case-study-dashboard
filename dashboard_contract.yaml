schema_version: 1
app:
  name: "Medical Equipment Program Case Study"
  path: "case_study_streamlit_dashboard"
  framework: "streamlit"
  owner: "Ryker Iverson"
  audience: "Snap Finance Talent Acquisition and management review team"
  status: "case-study"
business:
  question: "Should Snap continue, expand, modify, or tighten the medical equipment provider special underwriting program?"
  decision_or_workflow: "Support a management review of the program funnel, special underwriting impact, applicant risk profile, and follow-up data needs."
data:
  classification: "case-study extract; do not treat as live production reporting"
  row_grain: "One row per prequalification application"
  date_grain: "Prequalification submit date and submit month"
  refresh_cadence: "Static ad hoc extract packaged with dashboard"
  source_of_truth:
    - "data/case_study_dataset.csv"
  prepared_assets:
    - "data/case_study_dataset.csv"
  pii: false
  notes:
    - "Application numbers are included only as case-study record identifiers."
    - "No repayment or profitability table was provided."
metrics:
  - name: "Prequal Applications"
    definition: "Count of application records in the selected filter scope."
    filters: ["Prequal Submit Date", "Region", "Merchant ID", "Prequalification Risk Grade", "Swap-In Approval"]
  - name: "Prequal Approval Rate"
    definition: "Prequal approvals divided by total applications."
    filters: ["Prequal Submit Date", "Region", "Merchant ID", "Prequalification Risk Grade", "Swap-In Approval"]
  - name: "Continuation Rate"
    definition: "Full applications divided by prequal approvals."
    filters: ["Prequal Submit Date", "Region", "Merchant ID", "Prequalification Risk Grade", "Swap-In Approval"]
  - name: "Final Approval Rate"
    definition: "Final approvals divided by full applications."
    filters: ["Prequal Submit Date", "Region", "Merchant ID", "Prequalification Risk Grade", "Swap-In Approval"]
  - name: "End-To-End Completion"
    definition: "Completed applications divided by total applications."
    filters: ["Prequal Submit Date", "Region", "Merchant ID", "Prequalification Risk Grade", "Swap-In Approval"]
  - name: "Estimated Funded Amount"
    definition: "Final approval amount summed only for completed applications; proxy only because actual funded amount was not provided."
    filters: ["Prequal Submit Date", "Region", "Merchant ID", "Prequalification Risk Grade", "Swap-In Approval"]
  - name: "$1,500 Floor Share"
    definition: "Share of records where risk-based amount is below $1,500 and actual prequal approval amount equals $1,500."
    filters: ["Prequal Submit Date", "Region", "Merchant ID", "Prequalification Risk Grade", "Swap-In Approval"]
  - name: "Risk Grade Migration"
    definition: "Final risk grade compared with prequalification risk grade for applicants who submitted a full application."
    filters: ["Prequal Submit Date", "Region", "Merchant ID", "Prequalification Risk Grade", "Swap-In Approval"]
filters:
  - name: "Prequal Submit Date"
    field: "prequal_submit_dt"
    notes: "Inclusive date range from the static extract."
  - name: "Region"
    field: "region"
    notes: "Optional multi-select."
  - name: "Merchant ID"
    field: "merchant_id"
    notes: "Optional multi-select."
  - name: "Prequalification Risk Grade"
    field: "prequalification_risk_grade"
    notes: "Optional multi-select across A through G where present."
  - name: "Swap-In Approval"
    field: "swap_in_approval"
    notes: "Optional multi-select for swap-in versus non-swap applications."
outputs:
  primary_views:
    - "Executive Answer"
    - "Funnel"
    - "Special Underwriting"
    - "Risk Profile"
    - "Recommendation Detail"
    - "Data Gaps"
    - "Appendix"
  exportable: true
validation:
  local_run: "streamlit run app.py"
  data_checks:
    - "Required source columns are validated before calculations run."
    - "Boolean, date, and numeric fields are normalized in data.py."
    - "Rate denominators are protected against zero denominators."
    - "Empty filter results display a warning and stop rendering."
  risk_areas:
    - "Estimated funded amount is a proxy using final approval amount for completed applications."
    - "Repayment, delinquency, charge-off, and profitability questions are explicitly marked unavailable."
    - "Static local extract should not be presented as live or refreshed production reporting."
